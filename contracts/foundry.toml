[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [
  { access = "read", path = "./test/fork-assets.json" },
  { access = "read", path = "./deploy/assets.json" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56 }

[lint]
lint_on_build = false
